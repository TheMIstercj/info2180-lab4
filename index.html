<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superhero Search</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Superhero Search</h1>
    </header>

    <main>
        <h2>Find a Superhero</h2>
        <p>Enter a superhero's name or alias, or leave the field blank to see the full list.</p>

        <div class="search-area">
            <label for="search-input">Superhero name or alias</label>
            <div class="search-controls">
                <input type="text" id="search-input" placeholder="e.g. Ironman or Tony Stark" autocomplete="off">
                <button type="button" id="search-button">Search</button>
            </div>
        </div>

        <div id="result" aria-live="polite"></div>
    </main>
</body>
</html>
